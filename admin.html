<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้าน - สวนราชินี กำแพงเพชร</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-6 sm:p-8 space-y-8">
        <div>
            <h1 class="text-2xl font-bold text-amber-800 mb-2">🍵 ระบบหลังบ้าน: สวนราชินี กำแพงเพชร</h1>
            <p class="text-gray-600">เพิ่ม/แก้ไขสินค้าและคูปองส่วนลด ข้อมูลจะซิงค์ไปที่ GitHub อัตโนมัติ</p>
        </div>

        <!-- 1. ส่วนจัดการสินค้า -->
        <div class="bg-amber-50/50 border border-amber-200 rounded-xl p-4 sm:p-6">
            <h2 class="text-lg font-semibold text-amber-900 mb-4">➕ เพิ่มสินค้าใหม่</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อสินค้า</label>
                    <input type="text" id="prodName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="เช่น ฟีโรโมนล่อชันโรง">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ราคา (บาท)</label>
                    <input type="number" id="prodPrice" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="เช่น 250">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">ลิงก์รูปภาพสินค้า (Image URL)</label>
                <input type="text" id="prodImg" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="https://...">
            </div>
            <button onclick="addProduct()" class="w-full sm:w-auto bg-amber-700 hover:bg-amber-800 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow">
                💾 บันทึกสินค้าขึ้น GitHub
            </button>
            <span id="statusMsg" class="ml-3 text-sm font-medium text-gray-600"></span>
        </div>

        <div>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">📦 รายการสินค้าทั้งหมด</h2>
            <div id="productList" class="space-y-3">
                <p class="text-gray-500 text-sm">กำลังโหลดข้อมูลสินค้า...</p>
            </div>
        </div>

        <hr class="border-gray-200">

        <!-- 2. ส่วนจัดการคูปองส่วนลด -->
        <div class="bg-yellow-50/50 border border-yellow-200 rounded-xl p-4 sm:p-6">
            <h2 class="text-lg font-semibold text-amber-900 mb-4">🎟️ เพิ่มคูปองส่วนลด / โค้ดส่งฟรี</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อคูปอง</label>
                    <input type="text" id="couponName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="เช่น ส่วนลดพิเศษ 50 บาท">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">มูลค่าส่วนลด (บาท)</label>
                    <input type="number" id="couponDiscount" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="เช่น 50">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">ประเภทคูปอง</label>
                <select id="couponType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <option value="discount">คูปองส่วนลดสินค้า</option>
                    <option value="freeshipping">โค้ดส่วนลดค่าจัดส่ง (ส่งฟรี)</option>
                </select>
            </div>
            <button onclick="addCoupon()" class="w-full sm:w-auto bg-amber-600 hover:bg-amber-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow">
                💾 บันทึกคูปองขึ้น GitHub
            </button>
            <span id="couponStatusMsg" class="ml-3 text-sm font-medium text-gray-600"></span>
        </div>

        <div>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">🏷️ รายการคูปองทั้งหมดในระบบ</h2>
            <div id="couponList" class="space-y-3">
                <p class="text-gray-500 text-sm">กำลังโหลดข้อมูลคูปอง...</p>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = "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";
        const REPO_OWNER = "aromdee2012-lgtm";
        const REPO_NAME = "suan-rachinee";

        // --- จัดการสินค้า ---
        let products = [];
        let productSha = "";

        async function loadProducts() {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/products.json`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    productSha = data.sha;
                    products = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    renderProducts();
                } else {
                    document.getElementById('productList').innerHTML = '<p class="text-amber-600 text-sm">ยังไม่มีไฟล์ products.json</p>';
                }
            } catch (err) {
                document.getElementById('productList').innerHTML = '<p class="text-red-500 text-sm">ไม่สามารถโหลดข้อมูลสินค้าได้</p>';
            }
        }

        function renderProducts() {
            const listDiv = document.getElementById('productList');
            if (products.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500 text-sm">ยังไม่มีสินค้าในระบบ</p>';
                return;
            }
            listDiv.innerHTML = products.map((p, index) => `
                <div class="flex items-center justify-between border border-gray-200 p-3 rounded-xl bg-white shadow-xs">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" alt="${p.name}" class="w-12 h-12 object-cover rounded-lg border" onerror="this.src='https://placehold.co/100?text=No+Image'">
                        <div>
                            <h3 class="font-medium text-gray-800">${p.name}</h3>
                            <p class="text-sm text-amber-700 font-semibold">${p.price} บาท</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${index})" class="text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1 bg-red-50 rounded-lg transition-colors">🗑️ ลบ</button>
                </div>
            `).join('');
        }

        async function addProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const image = document.getElementById('prodImg').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!name || !price || !image) {
                alert('กรุณากรอกข้อมูลสินค้าให้ครบถ้วนครับ');
                return;
            }

            statusMsg.textContent = "กำลังบันทึกสินค้า...";
            products.push({ id: Date.now(), name, price: Number(price), image, shippingFee: 0 });

            const success = await saveJSONToGitHub('products.json', products, productSha);
            if (success) {
                statusMsg.textContent = "✅ บันทึกสินค้าสำเร็จ!";
                statusMsg.className = "ml-3 text-sm font-medium text-green-600";
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodImg').value = '';
                loadProducts();
            } else {
                statusMsg.textContent = "❌ บันทึกไม่สำเร็จ";
                statusMsg.className = "ml-3 text-sm font-medium text-red-600";
                products.pop();
            }
        }

        async function deleteProduct(index) {
            if (!confirm('ต้องการลบสินค้านี้ใช่ไหมครับ?')) return;
            products.splice(index, 1);
            const success = await saveJSONToGitHub('products.json', products, productSha);
            if (success) loadProducts();
            else { alert('ลบไม่สำเร็จ'); loadProducts(); }
        }


        // --- จัดการคูปอง ---
        let coupons = [];
        let couponSha = "";

        async function loadCoupons() {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/coupons.json`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    couponSha = data.sha;
                    coupons = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    renderCoupons();
                } else {
                    document.getElementById('couponList').innerHTML = '<p class="text-amber-600 text-sm">ยังไม่มีไฟล์ coupons.json</p>';
                }
            } catch (err) {
                document.getElementById('couponList').innerHTML = '<p class="text-red-500 text-sm">ไม่สามารถโหลดข้อมูลคูปองได้</p>';
            }
        }

        function renderCoupons() {
            const listDiv = document.getElementById('couponList');
            if (coupons.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500 text-sm">ยังไม่มีคูปองในระบบ</p>';
                return;
            }
            listDiv.innerHTML = coupons.map((c, index) => `
                <div class="flex items-center justify-between border border-yellow-200 p-3 rounded-xl bg-white shadow-xs">
                    <div>
                        <span class="text-[10px] bg-amber-600 text-white px-2 py-0.5 rounded-full font-semibold">${c.type === 'freeshipping' ? 'โค้ดส่งฟรี' : 'คูปองส่วนลด'}</span>
                        <h3 class="font-medium text-gray-800 mt-1">${c.name}</h3>
                        <p class="text-sm text-amber-700 font-semibold">มูลค่า: ${c.discount} บาท</p>
                    </div>
                    <button onclick="deleteCoupon(${index})" class="text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1 bg-red-50 rounded-lg transition-colors">🗑️ ลบ</button>
                </div>
            `).join('');
        }

        async function addCoupon() {
            const name = document.getElementById('couponName').value.trim();
            const discount = document.getElementById('couponDiscount').value.trim();
            const type = document.getElementById('couponType').value;
            const statusMsg = document.getElementById('couponStatusMsg');

            if (!name || !discount) {
                alert('กรุณากรอกชื่อคูปองและมูลค่าส่วนลดให้ครบถ้วนครับ');
                return;
            }

            statusMsg.textContent = "กำลังบันทึกคูปอง...";
            coupons.push({ id: Date.now(), name, discount: Number(discount), type });

            const success = await saveJSONToGitHub('coupons.json', coupons, couponSha);
            if (success) {
                statusMsg.textContent = "✅ บันทึกคูปองสำเร็จ!";
                statusMsg.className = "ml-3 text-sm font-medium text-green-600";
                document.getElementById('couponName').value = '';
                document.getElementById('couponDiscount').value = '';
                loadCoupons();
            } else {
                statusMsg.textContent = "❌ บันทึกไม่สำเร็จ";
                statusMsg.className = "ml-3 text-sm font-medium text-red-600";
                coupons.pop();
            }
        }

        async function deleteCoupon(index) {
            if (!confirm('ต้องการลบคูปองนี้ใช่ไหมครับ?')) return;
            coupons.splice(index, 1);
            const success = await saveJSONToGitHub('coupons.json', coupons, couponSha);
            if (success) loadCoupons();
            else { alert('ลบไม่สำเร็จ'); loadCoupons(); }
        }


        // --- ฟังก์ชันกลางสำหรับบันทึกข้อมูลลง GitHub ---
        async function saveJSONToGitHub(filePath, dataObj, currentSha) {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`;
            const jsonString = JSON.stringify(dataObj, null, 2);
            const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

            const bodyData = {
                message: `Update ${filePath} via Admin Dashboard`,
                content: contentBase64
            };
            if (currentSha) {
                bodyData.sha = currentSha;
            }

            try {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    const data = await res.json();
                    if (filePath === 'products.json') productSha = data.content.sha;
                    if (filePath === 'coupons.json') couponSha = data.content.sha;
                    return true;
                }
                return false;
            } catch (err) {
                return false;
            }
        }

        // โหลดข้อมูลทั้งหมดเมื่อเปิดหน้าเว็บ
        loadProducts();
        loadCoupons();
    </script>
</body>
</html>
