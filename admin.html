<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้าน - สวนราชินี กำแพงเพชร</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-6 sm:p-8 space-y-8">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-amber-800 mb-1">🍵 ระบบหลังบ้าน: สวนราชินี กำแพงเพชร</h1>
                <p class="text-gray-600 text-sm">เพิ่ม/แก้ไขสินค้าและคูปองส่วนลด ข้อมูลซิงค์ขึ้น GitHub อัตโนมัติ</p>
            </div>
            <a href="index.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm px-4 py-2 rounded-lg font-medium transition-colors">🏠 ไปหน้าหลักร้าน</a>
        </div>

        <!-- 1. ส่วนจัดการสินค้า -->
        <div class="bg-amber-50/50 border border-amber-200 rounded-xl p-4 sm:p-6">
            <h2 class="text-lg font-semibold text-amber-900 mb-4">➕ เพิ่ม / แก้ไข สินค้า</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อสินค้า</label>
                    <input type="text" id="prodName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white" placeholder="เช่น ฟีโรโมนล่อชันโรง">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ราคา (บาท)</label>
                    <input type="number" id="prodPrice" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white" placeholder="เช่น 250">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">ลิงก์รูปภาพ (URL)</label>
                <input type="text" id="prodImg" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white" placeholder="https://...">
            </div>
            <button onclick="addProduct()" class="w-full sm:w-auto bg-amber-700 hover:bg-amber-800 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow cursor-pointer">
                💾 บันทึกสินค้าขึ้น GitHub
            </button>
            <span id="statusMsg" class="ml-3 text-sm font-medium text-gray-600"></span>
        </div>

        <div>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">📦 รายการสินค้าทั้งหมดในระบบ</h2>
            <div id="productList" class="space-y-3">
                <p class="text-gray-500 text-sm">กำลังโหลดข้อมูลสินค้า...</p>
            </div>
        </div>

        <hr class="border-gray-200">

        <!-- 2. ส่วนจัดการคูปองส่วนลด -->
        <div class="bg-yellow-50/50 border border-yellow-200 rounded-xl p-4 sm:p-6">
            <h2 class="text-lg font-semibold text-amber-900 mb-4">🎟️ เพิ่มคูปองส่วนลด / โค้ดส่งฟรี</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อคูปอง</label>
                    <input type="text" id="couponName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white" placeholder="เช่น ส่วนลดพิเศษ 50 บาท">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">มูลค่าส่วนลด (บาท)</label>
                    <input type="number" id="couponDiscount" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white" placeholder="เช่น 50">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">ประเภทคูปอง</label>
                <select id="couponType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none bg-white">
                    <option value="discount">คูปองส่วนลดสินค้า</option>
                    <option value="freeshipping">โค้ดส่วนลดค่าจัดส่ง (ส่งฟรี)</option>
                </select>
            </div>
            <button onclick="addCoupon()" class="w-full sm:w-auto bg-amber-600 hover:bg-amber-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow cursor-pointer">
                💾 บันทึกคูปองขึ้น GitHub
            </button>
            <span id="couponStatusMsg" class="ml-3 text-sm font-medium text-gray-600"></span>
        </div>

        <div>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">🏷️ รายการคูปองทั้งหมดในระบบ</h2>
            <div id="couponList" class="space-y-3">
                <p class="text-gray-500 text-sm">กำลังโหลดข้อมูลคูปอง...</p>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = "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";
        const REPO_OWNER = "aromdee2012-lgtm";
        const REPO_NAME = "suan-rachinee";

        // --- ฟังก์ชันกลางดึงข้อมูลจาก GitHub พร้อมป้องกัน Cache ---
        async function fetchGitHubFile(filePath) {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}?t=${Date.now()}`;
            try {
                const res = await fetch(url, { cache: "no-store" });
                if (res.ok) {
                    const data = await res.json();
                    const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    return { content, sha: data.sha };
                }
            } catch (err) {
                console.error("Error fetching " + filePath, err);
            }
            return { content: [], sha: null };
        }

        // --- ฟังก์ชันกลางบันทึกข้อมูลลง GitHub ---
        async function saveJSONToGitHub(filePath, dataObj, currentSha) {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`;
            const jsonString = JSON.stringify(dataObj, null, 2);
            const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

            const bodyData = {
                message: `Update ${filePath} via Admin Dashboard`,
                content: contentBase64
            };
            if (currentSha) {
                bodyData.sha = currentSha;
            }

            try {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    const resData = await res.json();
                    return resData.content.sha; // คืนค่า SHA ใหม่หลังบันทึก
                }
                return null;
            } catch (err) {
                return null;
            }
        }

        // --- จัดการสินค้า ---
        let currentProductSha = null;

        async function loadProducts() {
            const result = await fetchGitHubFile('products.json');
            currentProductSha = result.sha;
            renderProducts(result.content);
        }

        function renderProducts(products) {
            const listDiv = document.getElementById('productList');
            if (!products || products.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500 text-sm">ยังไม่มีสินค้าในระบบ</p>';
                return;
            }
            listDiv.innerHTML = products.map((p, index) => `
                <div class="flex items-center justify-between border border-gray-200 p-3 rounded-xl bg-white shadow-xs">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" alt="${p.name}" class="w-12 h-12 object-cover rounded-lg border" onerror="this.src='https://placehold.co/100?text=No+Image'">
                        <div>
                            <h3 class="font-medium text-gray-800">${p.name}</h3>
                            <p class="text-sm text-amber-700 font-semibold">${p.price} บาท</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${index})" class="text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1 bg-red-50 rounded-lg transition-colors cursor-pointer">🗑️ ลบ</button>
                </div>
            `).join('');
        }

        async function addProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const image = document.getElementById('prodImg').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!name || !price || !image) {
                alert('กรุณากรอกข้อมูลสินค้าให้ครบถ้วนครับ');
                return;
            }

            statusMsg.textContent = "กำลังบันทึกข้อมูล...";

            // 1. ดึงข้อมูลล่าสุดและ SHA ล่าสุดจาก GitHub สดๆ ก่อนเซฟเสมอ
            const remote = await fetchGitHubFile('products.json');
            let products = remote.content;
            currentProductSha = remote.sha;

            // 2. เพิ่มสินค้าใหม่เข้าไป
            products.push({ id: Date.now(), name, price: Number(price), image, shippingFee: 0 });

            // 3. บันทึกขึ้น GitHub
            const newSha = await saveJSONToGitHub('products.json', products, currentProductSha);
            if (newSha) {
                currentProductSha = newSha;
                statusMsg.textContent = "✅ บันทึกสินค้าสำเร็จ!";
                statusMsg.className = "ml-3 text-sm font-medium text-green-600";
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodImg').value = '';
                renderProducts(products);
            } else {
                statusMsg.textContent = "❌ บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง";
                statusMsg.className = "ml-3 text-sm font-medium text-red-600";
            }
        }

        async function deleteProduct(index) {
            if (!confirm('ต้องการลบสินค้านี้ใช่ไหมครับ?')) return;

            const remote = await fetchGitHubFile('products.json');
            let products = remote.content;
            
            products.splice(index, 1);
            const newSha = await saveJSONToGitHub('products.json', products, remote.sha);
            
            if (newSha) {
                currentProductSha = newSha;
                renderProducts(products);
            } else {
                alert('ลบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
                loadProducts();
            }
        }


        // --- จัดการคูปอง ---
        let currentCouponSha = null;

        async function loadCoupons() {
            const result = await fetchGitHubFile('coupons.json');
            currentCouponSha = result.sha;
            renderCoupons(result.content);
        }

        function renderCoupons(coupons) {
            const listDiv = document.getElementById('couponList');
            if (!coupons || coupons.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500 text-sm">ยังไม่มีคูปองในระบบ</p>';
                return;
            }
            listDiv.innerHTML = coupons.map((c, index) => `
                <div class="flex items-center justify-between border border-yellow-200 p-3 rounded-xl bg-white shadow-xs">
                    <div>
                        <span class="text-[10px] bg-amber-600 text-white px-2 py-0.5 rounded-full font-semibold">${c.type === 'freeshipping' ? 'โค้ดส่งฟรี' : 'คูปองส่วนลด'}</span>
                        <h3 class="font-medium text-gray-800 mt-1">${c.name}</h3>
                        <p class="text-sm text-amber-700 font-semibold">มูลค่า: ${c.discount} บาท</p>
                    </div>
                    <button onclick="deleteCoupon(${index})" class="text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1 bg-red-50 rounded-lg transition-colors cursor-pointer">🗑️ ลบ</button>
                </div>
            `).join('');
        }

        async function addCoupon() {
            const name = document.getElementById('couponName').value.trim();
            const discount = document.getElementById('couponDiscount').value.trim();
            const type = document.getElementById('couponType').value;
            const statusMsg = document.getElementById('couponStatusMsg');

            if (!name || !discount) {
                alert('กรุณากรอกชื่อคูปองและมูลค่าส่วนลดให้ครบถ้วนครับ');
                return;
            }

            statusMsg.textContent = "กำลังบันทึกข้อมูล...";

            const remote = await fetchGitHubFile('coupons.json');
            let coupons = remote.content;
            currentCouponSha = remote.sha;

            coupons.push({ id: Date.now(), name, discount: Number(discount), type });

            const newSha = await saveJSONToGitHub('coupons.json', coupons, currentCouponSha);
            if (newSha) {
                currentCouponSha = newSha;
                statusMsg.textContent = "✅ บันทึกคูปองสำเร็จ!";
                statusMsg.className = "ml-3 text-sm font-medium text-green-600";
                document.getElementById('couponName').value = '';
                document.getElementById('couponDiscount').value = '';
                renderCoupons(coupons);
            } else {
                statusMsg.textContent = "❌ บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง";
                statusMsg.className = "ml-3 text-sm font-medium text-red-600";
            }
        }

        async function deleteCoupon(index) {
            if (!confirm('ต้องการลบคูปองนี้ใช่ไหมครับ?')) return;

            const remote = await fetchGitHubFile('coupons.json');
            let coupons = remote.content;

            coupons.splice(index, 1);
            const newSha = await saveJSONToGitHub('coupons.json', coupons, remote.sha);
            
            if (newSha) {
                currentCouponSha = newSha;
                renderCoupons(coupons);
            } else {
                alert('ลบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
                loadCoupons();
            }
        }

        // โหลดข้อมูลทั้งหมดเมื่อเปิดหน้าเว็บ
        loadProducts();
        loadCoupons();
    </script>
</body>
</html>
