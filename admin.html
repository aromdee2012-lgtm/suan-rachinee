<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้าน - สวนราชินี กำแพงเพชร</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-amber-800 mb-2">🍵 ระบบจัดการสินค้า: สวนราชินี กำแพงเพชร</h1>
        <p class="text-gray-600 mb-6">เพิ่ม/แก้ไขสินค้า ข้อมูลจะซิงค์ไปที่ GitHub อัตโนมัติ</p>

        <!-- ฟอร์มกรอกข้อมูลสินค้า -->
        <div class="bg-amber-50/50 border border-amber-200 rounded-xl p-4 sm:p-6 mb-8">
            <h2 class="text-lg font-semibold text-amber-900 mb-4">➕ เพิ่มสินค้าใหม่</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อสินค้า</label>
                    <input type="text" id="prodName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="เช่น ฟีโรโมนล่อชันโรง">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ราคา (บาท)</label>
                    <input type="number" id="prodPrice" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="เช่น 250">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">ลิงก์รูปภาพสินค้า (Shopee URL)</label>
                <input type="text" id="prodImg" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="https://cf.shopee.co.th/file/...">
            </div>
            <button onclick="addProduct()" class="w-full sm:w-auto bg-amber-700 hover:bg-amber-800 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow">
                💾 บันทึกและอัปเดตขึ้น GitHub
            </button>
            <span id="statusMsg" class="ml-3 text-sm font-medium text-gray-600"></span>
        </div>

        <!-- รายการสินค้าปัจจุบัน -->
        <div>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">📦 รายการสินค้าทั้งหมด</h2>
            <div id="productList" class="space-y-3">
                <p class="text-gray-500 text-sm">กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = "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";
        const REPO_OWNER = "aromdee2012-lgtm";
        const REPO_NAME = "suan-rachinee";
        const FILE_PATH = "products.json";

        let products = [];
        let fileSha = "";

        async function loadProducts() {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    const jsonString = decodeURIComponent(escape(atob(data.content)));
                    products = JSON.parse(jsonString);
                    renderProducts();
                } else {
                    document.getElementById('productList').innerHTML = '<p class="text-amber-600 text-sm">ยังไม่มีไฟล์ products.json (สามารถเพิ่มสินค้าแรกเพื่อสร้างไฟล์ได้เลยครับ)</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('productList').innerHTML = '<p class="text-red-500 text-sm">ไม่สามารถโหลดข้อมูลสินค้าได้</p>';
            }
        }

        function renderProducts() {
            const listDiv = document.getElementById('productList');
            if (products.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500 text-sm">ยังไม่มีสินค้าในระบบ</p>';
                return;
            }

            listDiv.innerHTML = products.map((p, index) => `
                <div class="flex items-center justify-between border border-gray-200 p-3 rounded-xl bg-white shadow-xs">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" alt="${p.name}" class="w-12 h-12 object-cover rounded-lg border" onerror="this.src='https://placehold.co/100?text=No+Image'">
                        <div>
                            <h3 class="font-medium text-gray-800">${p.name}</h3>
                            <p class="text-sm text-amber-700 font-semibold">${p.price} บาท</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${index})" class="text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1 bg-red-50 rounded-lg transition-colors">
                        🗑️ ลบ
                    </button>
                </div>
            `).join('');
        }

        async function addProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const image = document.getElementById('prodImg').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!name || !price || !image) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วนครับคุณลุงแจ่ม');
                return;
            }

            statusMsg.textContent = "กำลังบันทึกข้อมูลขึ้น GitHub...";
            statusMsg.className = "ml-3 text-sm font-medium text-amber-600";

            products.push({ name, price: Number(price), image });

            const success = await saveToGitHub();
            if (success) {
                statusMsg.textContent = "✅ บันทึกสำเร็จ! เว็บอัปเดตเรียบร้อย";
                statusMsg.className = "ml-3 text-sm font-medium text-green-600";
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodImg').value = '';
                renderProducts();
            } else {
                statusMsg.textContent = "❌ บันทึกไม่สำเร็จ กรุณาลองใหม่";
                statusMsg.className = "ml-3 text-sm font-medium text-red-600";
                products.pop();
            }
        }

        async function deleteProduct(index) {
            if (!confirm('ต้องการลบสินค้านี้ใช่ไหมครับ?')) return;
            products.splice(index, 1);
            const success = await saveToGitHub();
            if (success) {
                renderProducts();
            } else {
                alert('ลบไม่สำเร็จ กรุณาลองใหม่');
                loadProducts();
            }
        }

        async function saveToGitHub() {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            const jsonString = JSON.stringify(products, null, 2);
            const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

            const bodyData = {
                message: "Update products via Admin Dashboard",
                content: contentBase64
            };
            if (fileSha) {
                bodyData.sha = fileSha;
            }

            try {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.content.sha;
                    return true;
                } else {
                    return false;
                }
            } catch (err) {
                return false;
            }
        }

        loadProducts();
    </script>
</body>
</html>
