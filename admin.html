<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังร้าน สวนราชินี</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 pb-24">
    <!-- Header -->
    <header class="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">🔒 ระบบหลังร้าน สวนราชินี</h1>
                <p class="text-xs text-emerald-200">เพิ่ม/ลบ/แก้ไขสินค้าและซิงค์ข้อมูลขึ้น GitHub อัตโนมัติ</p>
            </div>
            <div>
                <a href="index.html" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors shadow">🏠 ไปหน้าร้าน</a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        <!-- Add/Edit Product Form -->
        <div class="bg-amber-50/60 border border-amber-200 rounded-2xl p-4 sm:p-6 shadow-xs space-y-4">
            <h3 id="formTitle" class="text-sm font-bold text-amber-900">➕ เพิ่มสินค้าใหม่</h3>
            <input type="hidden" id="editIndex" value="">
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">ชื่อสินค้า</label>
                    <input type="text" id="prodName" placeholder="เช่น ฟีโรโมนล่อชันโรง" class="w-full border border-gray-300 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">ราคา (บาท)</label>
                        <input type="number" id="prodPrice" placeholder="เช่น 250" class="w-full border border-gray-300 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">ค่าขนส่ง (บาท)</label>
                        <input type="number" id="prodShipping" placeholder="เช่น 20 หรือ 0" class="w-full border border-gray-300 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">ลิงก์รูปภาพ (URL)</label>
                        <input type="text" id="prodImage" placeholder="https://..." class="w-full border border-gray-300 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveProduct()" id="saveBtn" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-5 py-2 rounded-xl font-bold transition-colors shadow cursor-pointer">💾 บันทึกสินค้า</button>
                <button onclick="resetForm()" id="cancelBtn" class="hidden bg-gray-300 hover:bg-gray-400 text-gray-700 text-xs px-4 py-2 rounded-xl font-medium transition-colors">ยกเลิกแก้ไข</button>
            </div>
        </div>

        <!-- Product List Section -->
        <div class="space-y-3">
            <h3 class="text-sm font-bold text-gray-700">📦 รายการสินค้าทั้งหมดในระบบ</h3>
            <div id="adminProductList" class="space-y-2">
                <p class="text-gray-400 text-xs">กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </main>

    <script>
        // ตั้งค่า GitHub พร้อม Token ใหม่ของพี่แจ่ม
        const CONFIG = {
            username: "aromdee2012-lgtm",
            repo: "aromdee2012-lgtm.github.io",
            token: "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"
        };

        let products = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadProducts();
        });

        async function loadProducts() {
            try {
                const res = await fetch(`products.json?t=${Date.now()}`, { cache: "no-store" });
                if (res.ok) {
                    products = await res.json();
                } else {
                    products = [];
                }
            } catch (err) {
                products = [];
            }
            renderAdminProducts();
        }

        function renderAdminProducts() {
            const listDiv = document.getElementById('adminProductList');
            if (!products || products.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-400 text-xs bg-white p-4 rounded-xl border border-gray-200">ยังไม่มีสินค้าในระบบ</p>';
                return;
            }

            listDiv.innerHTML = products.map((p, index) => `
                <div class="bg-white border border-gray-200 p-3 rounded-xl flex items-center justify-between shadow-xs">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" alt="${p.name}" class="w-12 h-12 object-cover rounded-lg bg-gray-100" onerror="this.src='https://placehold.co/100?text=No+Image'">
                        <div>
                            <h4 class="text-xs font-bold text-gray-800">${p.name}</h4>
                            <p class="text-xs text-amber-700 font-semibold">ราคา: ${p.price} บาท | ค่าส่ง: ${p.shipping || 0} บาท</p>
                        </div>
                    </div>
                    <div class="flex space-x-1.5">
                        <button onclick="editProduct(${index})" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors cursor-pointer">✏️ แก้ไข</button>
                        <button onclick="deleteProduct(${index})" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors cursor-pointer">🗑️ ลบ</button>
                    </div>
                </div>
            `).join('');
        }

        function editProduct(index) {
            const p = products[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodShipping').value = p.shipping || 0;
            document.getElementById('prodImage').value = p.image;

            document.getElementById('formTitle').innerText = '✏️ แก้ไขสินค้า';
            document.getElementById('saveBtn').innerText = '💾 บันทึกการแก้ไข';
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editIndex').value = '';
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodShipping').value = '';
            document.getElementById('prodImage').value = '';

            document.getElementById('formTitle').innerText = '➕ เพิ่มสินค้าใหม่';
            document.getElementById('saveBtn').innerText = '💾 บันทึกสินค้า';
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        async function saveProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const shipping = parseFloat(document.getElementById('prodShipping').value) || 0;
            const image = document.getElementById('prodImage').value.trim();
            const editIndex = document.getElementById('editIndex').value;

            if (!name || isNaN(price)) {
                alert('กรุณากรอกชื่อสินค้าและราคาให้ถูกต้อง');
                return;
            }

            const productData = { name, price, shipping, image: image || 'https://placehold.co/300?text=No+Image' };

            if (editIndex === '') {
                products.push(productData);
            } else {
                products[editIndex] = productData;
            }

            await syncToGitHub();
        }

        async function deleteProduct(index) {
            if (confirm(`คุณต้องการลบสินค้า "${products[index].name}" ใช่หรือไม่?`)) {
                products.splice(index, 1);
                await syncToGitHub();
            }
        }

        async function syncToGitHub() {
            const token = CONFIG.token;
            const user = CONFIG.username;
            const repo = CONFIG.repo;

            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerText;
            btn.innerText = 'กำลังซิงค์ขึ้น GitHub...';
            btn.disabled = true;

            const filePath = 'products.json';
            const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${filePath}`;
            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));

            try {
                let sha = '';
                const getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const bodyData = {
                    message: "Update products.json via admin panel",
                    content: contentEncoded
                };
                if (sha) bodyData.sha = sha;

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (putRes.ok) {
                    alert('บันทึกและซิงค์ข้อมูลขึ้น GitHub สำเร็จเรียบร้อย!');
                    resetForm();
                    renderAdminProducts();
                } else {
                    const errJson = await putRes.json();
                    alert('เกิดข้อผิดพลาดในการบันทึก: ' + (errJson.message || 'ไม่สามารถเชื่อมต่อ GitHub ได้'));
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดระบบ: ' + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
