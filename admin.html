<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังร้าน - สวนราชินี กำแพงเพชร</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-4 sm:p-8">
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-2xl p-6 space-y-6">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-amber-800">🔒 ระบบหลังร้าน สวนราชินี</h1>
                <p class="text-xs text-gray-500">เพิ่ม/ลบสินค้าและซิงค์ข้อมูลขึ้น GitHub อัตโนมัติ</p>
            </div>
            <a href="index.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-lg font-medium transition-colors">🏠 ไปหน้าร้าน</a>
        </div>

        <!-- Form เพิ่มสินค้า -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 space-y-3">
            <h2 class="text-sm font-bold text-amber-900">➕ เพิ่มสินค้าใหม่</h2>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">ชื่อสินค้า</label>
                <input type="text" id="prodName" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white" placeholder="เช่น ฟีโรโมนล่อชันโรง">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">ราคา (บาท)</label>
                    <input type="number" id="prodPrice" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white" placeholder="เช่น 250">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">ลิงก์รูปภาพ (URL)</label>
                    <input type="text" id="prodImg" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white" placeholder="https://...">
                </div>
            </div>
            <div class="flex items-center gap-3 pt-1">
                <button onclick="addProduct()" class="bg-amber-700 hover:bg-amber-800 text-white text-xs px-5 py-2 rounded-lg font-medium transition-colors shadow cursor-pointer">💾 บันทึกสินค้า</button>
                <span id="statusMsg" class="text-xs font-medium"></span>
            </div>
        </div>

        <!-- รายการสินค้า -->
        <div>
            <h2 class="text-sm font-bold text-gray-800 mb-2">📦 รายการสินค้าทั้งหมด</h2>
            <div id="adminProductList" class="space-y-2">
                <p class="text-gray-400 text-xs">กำลังโหลด...</p>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = "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";
        const REPO_OWNER = "aromdee2012-lgtm";
        const REPO_NAME = "suan-rachinee";

        async function fetchGitHubFile(filePath) {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}?t=${Date.now()}`;
            try {
                const res = await fetch(url, { cache: "no-store" });
                if (res.ok) {
                    const data = await res.json();
                    const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    return { content, sha: data.sha };
                }
            } catch (err) {}
            return { content: [], sha: null };
        }

        async function saveJSONToGitHub(filePath, dataObj, currentSha) {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`;
            const jsonString = JSON.stringify(dataObj, null, 2);
            const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

            const bodyData = {
                message: `Update ${filePath} via Clean Admin`,
                content: contentBase64
            };
            if (currentSha) bodyData.sha = currentSha;

            try {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });
                if (res.ok) {
                    const resData = await res.json();
                    return resData.content.sha;
                }
            } catch (err) {}
            return null;
        }

        let currentSha = null;

        async function loadAdminProducts() {
            const result = await fetchGitHubFile('products.json');
            currentSha = result.sha;
            renderAdminProducts(result.content);
        }

        function renderAdminProducts(products) {
            const listDiv = document.getElementById('adminProductList');
            if (!products || products.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-400 text-xs">ยังไม่มีสินค้า</p>';
                return;
            }
            listDiv.innerHTML = products.map((p, index) => `
                <div class="flex items-center justify-between border border-gray-200 p-2.5 rounded-xl bg-white shadow-xs">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" class="w-10 h-10 object-cover rounded-lg border" onerror="this.src='https://placehold.co/100?text=No+Image'">
                        <div>
                            <h4 class="text-xs font-bold text-gray-800">${p.name}</h4>
                            <p class="text-xs text-amber-700 font-semibold">${p.price} บาท</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${index})" class="text-red-500 hover:text-red-700 text-xs px-2.5 py-1 bg-red-50 rounded-lg font-medium cursor-pointer">🗑️ ลบ</button>
                </div>
            `).join('');
        }

        async function addProduct() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const image = document.getElementById('prodImg').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!name || !price || !image) {
                alert('กรุณากรอกข้อมูลให้ครบถ้วนครับ');
                return;
            }

            statusMsg.textContent = "กำลังบันทึก...";
            statusMsg.className = "text-xs font-medium text-blue-600";

            // ดึงข้อมูลล่าสุดและ SHA สดๆ ก่อนเซฟ
            const remote = await fetchGitHubFile('products.json');
            let products = remote.content;
            currentSha = remote.sha;

            products.push({ id: Date.now(), name, price: Number(price), image });

            const newSha = await saveJSONToGitHub('products.json', products, currentSha);
            if (newSha) {
                currentSha = newSha;
                statusMsg.textContent = "✅ บันทึกสำเร็จ!";
                statusMsg.className = "text-xs font-medium text-green-600";
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodImg').value = '';
                renderAdminProducts(products);
            } else {
                statusMsg.textContent = "❌ บันทึกไม่สำเร็จ";
                statusMsg.className = "text-xs font-medium text-red-600";
            }
        }

        async function deleteProduct(index) {
            if (!confirm('ต้องการลบสินค้านี้ใช่ไหมครับ?')) return;

            const remote = await fetchGitHubFile('products.json');
            let products = remote.content;
            products.splice(index, 1);

            const newSha = await saveJSONToGitHub('products.json', products, remote.sha);
            if (newSha) {
                currentSha = newSha;
                renderAdminProducts(products);
            } else {
                alert('ลบไม่สำเร็จ กรุณาลองใหม่');
                loadAdminProducts();
            }
        }

        loadAdminProducts();
    </script>
</body>
</html>
