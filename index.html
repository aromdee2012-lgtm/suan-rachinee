<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวนราชินี กำแพงเพชร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- ส่วนหัวของร้าน -->
    <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🛒</span>
                <div>
                    <h1 class="font-bold text-lg leading-tight">สวนราชินี กำแพงเพชร</h1>
                    <p class="text-xs text-emerald-200">โทร. 0809898770</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="alert('ตะกร้าสินค้าของคุณ')" class="bg-emerald-700 hover:bg-emerald-650 text-xs px-3 py-1.5 rounded-lg flex items-center space-x-1 border border-emerald-600 transition">
                    <span>🛒 ตะกร้า</span>
                </button>
                <a href="https://line.me" target="_blank" class="bg-emerald-700 hover:bg-emerald-650 text-xs px-3 py-1.5 rounded-lg flex items-center space-x-1 border border-emerald-600 transition">
                    <span>💬 แชท</span>
                </a>
                <a href="admin.html" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow transition">
                    🔒 หลังร้าน
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- แบนเนอร์ยินดีต้อนรับ -->
        <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 mb-6 shadow-sm">
            <div class="flex justify-between items-start">
                <div>
                    <span class="bg-emerald-600 text-white text-xs px-2 py-0.5 rounded-full font-medium">ยินดีต้อนรับ</span>
                    <h2 class="font-bold text-emerald-900 text-lg mt-1">สวนราชินี กำแพงเพชร</h2>
                    <p class="text-xs text-gray-600 mt-0.5">190/2 หมู่ 9 ต.เทพนคร อ.เมือง จ.กำแพงเพชร</p>
                </div>
                <div class="text-right text-xs text-emerald-800 font-medium">
                    โทร 0809898770
                </div>
            </div>
        </div>

        <!-- คูปองส่วนลด -->
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 shadow-sm flex justify-between items-center">
            <div>
                <span class="bg-amber-600 text-white text-xs px-2 py-0.5 rounded-full font-medium">คูปองส่วนลด</span>
                <h3 class="font-bold text-amber-900 text-sm mt-1">ส่วนลดมาตรฐาน 20 บาท</h3>
                <p class="text-xs text-gray-600">กดเก็บเพื่อใช้เป็นส่วนลดในตะกร้าสินค้า</p>
            </div>
            <button onclick="alert('เก็บคูปองส่วนลด 20 บาทเรียบร้อยครับ!')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow">
                เก็บโค้ด
            </button>
        </div>

        <!-- ค้นหาสินค้า -->
        <div class="mb-6">
            <input type="text" placeholder="🔍 ค้นหาสินค้า..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-600 shadow-sm">
        </div>

        <!-- รายการสินค้าทั้งหมด -->
        <div class="mb-4">
            <h3 class="font-bold text-gray-800 text-base flex items-center space-x-2">
                <span>📦 รายการสินค้าทั้งหมด</span>
            </h3>
        </div>

        <!-- กล่องแสดงรายการสินค้า (ดึงข้อมูลจาก products.json อัตโนมัติ) -->
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <p class="text-gray-500 text-sm col-span-2 text-center py-8">กำลังโหลดสินค้า...</p>
        </div>
    </main>

    <!-- Script สำหรับดึงข้อมูลสินค้าจาก products.json มาแสดงผล -->
    <script>
        async function loadProducts() {
            try {
                const response = await fetch('products.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('ไม่พบข้อมูลสินค้า');
                const products = await response.json();
                
                const productList = document.getElementById('product-list');
                productList.innerHTML = '';

                if (products.length === 0) {
                    productList.innerHTML = '<p class="text-gray-500 text-sm col-span-2 text-center py-8">ยังไม่มีสินค้าในระบบ</p>';
                    return;
                }

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm flex flex-col justify-between hover:shadow-md transition';
                    card.innerHTML = `
                        <div>
                            <img src="${product.image || 'https://via.placeholder.com/300'}" alt="${product.name}" class="w-full h-48 object-cover bg-gray-100">
                            <div class="p-4">
                                <h4 class="font-semibold text-gray-800 text-sm mb-1 line-clamp-2">${product.name}</h4>
                                <p class="text-emerald-700 font-bold text-base">${product.price} บาท</p>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <button onclick="alert('เพิ่มสินค้าลงตะกร้า: ${product.name}')" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white text-xs py-2 rounded-xl font-medium transition shadow-sm">
                                เพิ่มลงตะกร้า
                            </button>
                        </div>
                    `;
                    productList.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('product-list').innerHTML = '<p class="text-red-500 text-sm col-span-2 text-center py-8">ไม่สามารถโหลดรายการสินค้าได้ในขณะนี้</p>';
            }
        }

        loadProducts();
    </script>
</body>
</html>
