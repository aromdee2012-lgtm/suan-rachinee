<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวนราชินี กำแพงเพชร</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 pb-24">
    <!-- Header -->
    <header class="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">🍵 สวนราชินี กำแพงเพชร</h1>
                <p class="text-xs text-emerald-200">โทร. 0809898770</p>
            </div>
            <div>
                <a href="admin.html" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors shadow">🔒 หลังร้าน</a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        <!-- Store Info -->
        <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 sm:p-6 flex justify-between items-center shadow-xs">
            <div>
                <span class="bg-emerald-700 text-white text-[10px] px-2 py-0.5 rounded-full font-semibold">ยินดีต้อนรับ</span>
                <h2 class="text-lg font-bold text-emerald-900 mt-1">สวนราชินี กำแพงเพชร</h2>
                <p class="text-xs text-emerald-700">190/2 หมู่ 9 ต.เทพนคร อ.เมือง จ.กำแพงเพชร</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-500">โทรศัพท์</p>
                <p class="text-sm font-bold text-emerald-800">0809898770</p>
            </div>
        </div>

        <!-- Coupons Section -->
        <div>
            <h3 class="text-sm font-bold text-gray-700 mb-3">🎟️ คูปองส่วนลดในระบบ</h3>
            <div id="couponList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <p class="text-gray-400 text-xs">กำลังโหลดคูปอง...</p>
            </div>
        </div>

        <!-- Product List Section -->
        <div>
            <h3 class="text-sm font-bold text-gray-700 mb-3">📦 รายการสินค้าทั้งหมด</h3>
            <div id="productList" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                <p class="text-gray-400 text-xs">กำลังโหลดสินค้า...</p>
            </div>
        </div>
    </main>

    <script>
        // ใช้ Raw URL ของ GitHub ตรงๆ เพื่อดึงข้อมูลล่าสุดแบบเรียลไทม์และไม่ติดแคช
        const PRODUCTS_URL = `products.json?t=${Date.now()}`;
        const COUPONS_URL = `coupons.json?t=${Date.now()}`;

        async function loadShopData() {
            // โหลดสินค้า
            try {
                const prodRes = await fetch(PRODUCTS_URL, { cache: "no-store" });
                if (prodRes.ok) {
                    const products = await prodRes.json();
                    renderProducts(products);
                } else {
                    document.getElementById('productList').innerHTML = '<p class="text-gray-400 text-xs col-span-full">ยังไม่มีสินค้าในระบบ</p>';
                }
            } catch (err) {
                document.getElementById('productList').innerHTML = '<p class="text-red-500 text-xs col-span-full">ไม่สามารถโหลดสินค้าได้</p>';
            }

            // โหลดคูปอง
            try {
                const couponRes = await fetch(COUPONS_URL, { cache: "no-store" });
                if (couponRes.ok) {
                    const coupons = await couponRes.json();
                    renderCoupons(coupons);
                } else {
                    document.getElementById('couponList').innerHTML = '<p class="text-gray-400 text-xs">ยังไม่มีคูปอง</p>';
                }
            } catch (err) {
                document.getElementById('couponList').innerHTML = '<p class="text-red-500 text-xs">ไม่สามารถโหลดคูปองได้</p>';
            }
        }

        function renderProducts(products) {
            const listDiv = document.getElementById('productList');
            if (!products || products.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-400 text-xs col-span-full">ยังไม่มีสินค้าในระบบ</p>';
                return;
            }
            listDiv.innerHTML = products.map(p => `
                <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-xs flex flex-col justify-between">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-36 object-cover bg-gray-100" onerror="this.src='https://placehold.co/300?text=No+Image'">
                    <div class="p-3 flex flex-col flex-grow justify-between">
                        <div>
                            <h4 class="text-xs font-bold text-gray-800 line-clamp-2">${p.name}</h4>
                            <p class="text-sm font-bold text-amber-700 mt-1">${p.price} บาท</p>
                        </div>
                        <button onclick="alert('เพิ่ม ${p.name} ลงตะกร้าแล้ว')" class="mt-3 w-full bg-emerald-700 hover:bg-emerald-800 text-white text-xs py-1.5 rounded-lg font-medium transition-colors cursor-pointer">เพิ่มลงตะกร้า</button>
                    </div>
                </div>
            `).join('');
        }

        function renderCoupons(coupons) {
            const listDiv = document.getElementById('couponList');
            if (!coupons || coupons.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-400 text-xs">ยังไม่มีคูปอง</p>';
                return;
            }
            listDiv.innerHTML = coupons.map(c => `
                <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-xl flex justify-between items-center shadow-xs">
                    <div>
                        <span class="text-[9px] bg-amber-600 text-white px-2 py-0.5 rounded-full font-semibold">${c.type === 'freeshipping' ? 'โค้ดส่งฟรี' : 'ส่วนลด'}</span>
                        <h4 class="text-xs font-bold text-gray-800 mt-1">${c.name}</h4>
                        <p class="text-xs text-amber-700 font-semibold">มูลค่า: ${c.discount} บาท</p>
                    </div>
                    <button onclick="alert('เก็บโค้ด ${c.name} แล้ว!')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors cursor-pointer shadow">เก็บโค้ด</button>
                </div>
            `).join('');
        }

        loadShopData();
    </script>
</body>
</html>
